name: synergy
description: "Anonymous social network with end-to-end encryption and privacy-first design."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1

  # Network
  http: ^1.3.0
  http_parser: ^4.0.0

  # Navigation
  go_router: ^17.2.2

  # Local Storage (encrypted)
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0

  # Encryption
  cryptography: ^2.7.0

  # Wallet
  reown_appkit: ^1.8.3
  web3dart: ^3.0.2

  # Environment
  flutter_dotenv: ^6.0.1

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  json_annotation: ^4.11.0
  jwt_decoder: ^2.0.1
  freezed_annotation: ^3.0.0

  # UI
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.6.0
  freezed: ^3.0.0
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - .env